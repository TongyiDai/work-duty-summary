<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">七步工作流：采集到落盘</title>
  <desc id="desc">对齐范围、采集证据、聚类职责域、成熟框架成文、交用户微调、写成可复用档案、可选写进记忆，用户确认是必经关卡。</desc>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#111111">
    <text x="96" y="84" font-size="28" font-weight="700">采集到落盘，用户确认是关卡</text>
    <text x="96" y="116" font-size="16" fill="#666666">先成文交你微调，确认后才落档、才可选写进记忆</text>
    <line x1="96" y1="144" x2="1104" y2="144" stroke="#E8E8E8" stroke-width="1"/>

    <g fill="#F5F5F5" stroke="#999999" stroke-width="1">
      <rect x="96" y="230" width="150" height="70"/>
      <rect x="286" y="230" width="150" height="70"/>
      <rect x="476" y="230" width="150" height="70"/>
      <rect x="666" y="230" width="150" height="70"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="171" y="270">对齐范围</text>
      <text x="361" y="270">采集证据</text>
      <text x="551" y="270">聚类职责域</text>
      <text x="741" y="270">成文</text>
    </g>
    <g stroke="#B8B8B8" stroke-width="1.5" fill="none">
      <path d="M246 265 L286 265"/>
      <path d="M436 265 L476 265"/>
      <path d="M626 265 L666 265"/>
    </g>

    <path d="M816 265 C856 265 866 380 906 380" stroke="#B8B8B8" stroke-width="1.5" fill="none"/>

    <rect x="906" y="345" width="198" height="70" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
    <line x1="906" y1="345" x2="1104" y2="345" stroke="#2F6BFF" stroke-width="8"/>
    <text x="1005" y="380" text-anchor="middle" font-size="17" font-weight="700">用户微调确认</text>
    <text x="1005" y="401" text-anchor="middle" font-size="12" fill="#666666">必经关卡</text>

    <g stroke="#2F6BFF" stroke-width="1.5" fill="none">
      <path d="M1005 415 C1005 455 620 455 620 455"/>
    </g>

    <g fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2">
      <rect x="326" y="440" width="290" height="70"/>
      <rect x="666" y="440" width="290" height="70"/>
    </g>
    <g font-size="16" text-anchor="middle" font-weight="600">
      <text x="471" y="475">写成可复用职责档案</text>
      <text x="811" y="475">可选：写进 Agent 记忆</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#666666">
      <text x="471" y="497">最终产出，无草稿痕迹</text>
      <text x="811" y="497">经同意，存抽象锚点</text>
    </g>

    <g fill="#2F6BFF">
      <circle cx="96" cy="580" r="4"/>
      <circle cx="1104" cy="580" r="4"/>
    </g>
    <line x1="112" y1="580" x2="1088" y2="580" stroke="#E8E8E8" stroke-width="1"/>
    <text x="600" y="587" text-anchor="middle" font-size="13" fill="#666666">不过度断言｜证据不足标注待确认，宁少勿编｜到期重跑对比、确认后刷新</text>
  </g>
</svg>
